# Grocery slice: which ESCI test searches go into the review that decides the grocery slice.
#
# ESCI has no product category, so candidates come from two signals, and a person decides each one (see
# grocery_review.yaml). A search is a candidate when either:
#   - its query text contains one of `query_terms` (whole words, case-insensitive), or
#   - at least `min_food_title_share` of its candidate products have a title containing one of `title_terms` AND a
#     pack size matching `title_size`.
# Terms are regular-expression fragments joined as \b(term|term|...)\b.
#
# A reviewed search counts as grocery when the shopper wants something to eat or drink: food, beverages, snacks,
# ingredients, coffee and tea, protein bars and powders. Kitchenware, appliances, books, pet food, and non-edible
# products that borrow food words (lotion, candles, costumes, oil filters) are not grocery.
---
review_pool_size: 600
min_food_title_share: 0.5
title_size: '\b\d+(\.\d+)?\s?(oz|ounce|ounces|fl oz|lb|lbs|pound|g|grams|count|ct|pack|pk)\b'
query_terms:
  - "food"
  - "snacks?"
  - "chips"
  - "crackers"
  - "cookies"
  - "candy"
  - "candies"
  - "chocolates?"
