[project]
name = "jevbench"
version = "0.1.0"
description = "Benchmark harness: TypeSafe Jev vs an LLM for e-commerce intent classification (accuracy, latency, token cost, calibration)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "arize-phoenix-client>=3.5",
    "arize-phoenix-otel>=0.17",
    "httpx>=0.28",
    "httpx2>=2.13",
    "numpy>=2.0",
    "openai>=1.100",
    "openinference-instrumentation-openai>=0.1.61",
    "openinference-semantic-conventions>=0.1.20",
    "opentelemetry-api>=1.45",
    "pandas>=2.2",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "scipy>=1.14",
    "truststore>=0.10",
    "typesafe-sdk>=0.1",
]

[project.scripts]
jevbench = "jevbench.cli:main"

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.5.260914",
    "pyright>=1.1.400",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.6",
    "scipy-stubs>=1.18.1.1",
    "yamllint>=1.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jevbench"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["jevbench"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
